# Chimera cluster (SLURM). Run the Snakemake main process on a login node
# inside tmux/screen; it submits every job with sbatch:
#
#   uv run --frozen --group pipeline snakemake -s workflow/Snakefile \
#       --profile workflow/profiles/chimera --config acid_config=configs/<id>.yaml
#
# Scientific parameters stay in the ACID config; this file only sets compute
# resources. Check accounts and partitions with `smypartition`. Runtimes and
# memory are first estimates: tune them after the first run (sacct / seff).
executor: slurm
jobs: 150
printshellcmds: true
rerun-incomplete: true
keep-going: true
# A failed job (e.g. out of memory) is submitted once more.
retries: 1
latency-wait: 60

# Per job; runtime in minutes. The SLURM plugin requests cpus_per_task CPUs,
# or the rule's threads when cpus_per_task is not set; a default
# cpus_per_task here would override every rule's threads, so it is only set
# per rule below, matching set-threads.
default-resources:
  slurm_account: "rse"
  slurm_partition: "ffa-short"   # max 2 h
  runtime: 5
  mem_mb: 4000

# Threads a job uses inside its SLURM allocation (OMP_NUM_THREADS etc.).
# Rules not listed use 1 (QC, correction, features are
# single-threaded per FOV; parallelism comes from running FOVs side by side).
set-threads:
  # Background fit: 5 channel threads x 6 OpenMP threads (rolling ball).
  background_function: 32
  # Reading and decoding one ND2 file.
  extract_acquisition: 4
  # Cellpose pre/post-processing next to the GPU.
  segment: 4

set-resources:
  extract_acquisition:
    runtime: 60
    mem_mb: 16000
    cpus_per_task: 4
  background_function:
    slurm_partition: "ffa"
    runtime: 120
    mem_mb: 64000
    cpus_per_task: 32
  segment:
    slurm_partition: "gpu-ffa"
    # Chimera's GPU partitions take --gres only (not --gpus=N, which the
    # plugin's `gpu` resource would produce). mps:20 is a fifth of an MPS
    # GPU (L40, 48 GB: ~9.6 GB VRAM), enough for Cellpose on one FOV, so five
    # FOV jobs share one GPU. Use "gpu:1" for a whole GPU.
    gres: "mps:20"
    runtime: 10
    mem_mb: 16000
    cpus_per_task: 4
  extract_features:
    runtime: 15
    mem_mb: 16000

# Every raw file and FOV is its own SLURM job. Bundling FOVs into group jobs
# (group-components) is not used: Snakemake 9.27 additionally created one
# group with every segmentation job, which exceeded the partition time limit
# and would have run all FOVs a second time.
