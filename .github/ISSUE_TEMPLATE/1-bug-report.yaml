name: 🪳 Bug Report
description: Create a report to help us reproduce and fix the bug

title: "[BUG]: "
labels:
  - "bug"
  - "triage"

body:
  - type: markdown
    attributes:
      value: >
        **Before submitting a bug, please make sure the issue hasn't been already addressed by [searching through](https://github.com/IDIP-Platform/ACID/issues).**
        Please write your bug report in English to ensure it can be understood and addressed by the development team.

  #----------------   Installed From --------------
  - type: dropdown
    id: source
    attributes:
      label: Source
      description: ACID has been installed from
      options:
        - conda
        - pip
        - uv
        - poetry
        - other (specify in text)
    validations:
      required: True

  - type: input
    id: source-other
    attributes:
      label: other source
      placeholder: e.g., from source

  #--------------   Python version   --------------
  - type: input
    id: Python
    attributes:
      label: Python version
      placeholder: e.g., 3.12
    validations:
      required: true

  #--------------   ACID version   --------------
  - type: input
    id: ACID-version
    attributes:
      label: ACID version
      placeholder: e.g., ACID v0.1.0
    validations:
      required: true

  #--------------   OS Platform and distribution   --------------
  - type: input
    id: OS
    attributes:
      label: OS platform and distribution
      placeholder: e.g., Linux Ubuntu 24.04

  #--------------   Describe the Bug   --------------
  - type: textarea
    attributes:
      label: Describe the bug
      description: |
        Please provide a clear and concise description of the bug in the ACID workflow.

        If applicable, include the pipeline stage where the problem happened, such as:
        ND2 import, field-of-view extraction, metadata generation, train/test split, image quality control,
        background function calculation, background correction, segmentation, feature extraction, or image/object measurement.

        If the issue can be reproduced with a short code snippet, include the smallest possible example.
        Please remove unrelated notebook cells or exploratory code. We should be able to copy and run the example
        and observe the same failure. When possible, use a small synthetic array or a tiny shareable sample file
        instead of private or large microscopy data. Include all relevant imports and parameter values. For example:

        ```python
        import numpy as np

        from acid.image_processing.correct_background import correct_background

        image = np.array([[10, 12], [14, 16]], dtype=np.uint16)
        background = np.array([[2, 2], [2, 2]], dtype=np.uint16)

        corrected = correct_background(
            image=image,
            background=background,
            method="subtraction",
            output_dtype=np.uint16,
        )
        ```

        If the code is too lengthy (though we hope it's not), feel free to place it in a public gist and share the link in the issue: https://gist.github.com.

        Please include what you expected ACID to produce and what actually happened.
        Relevant details may include affected file names, image shape, channel order, metadata columns,
        output directory, generated OME-TIFF files, segmentation masks, feature table columns, or QC flags.
        If you encounter an error, include the error message along with the full traceback. It's helpful to wrap error messages in ```` ```triple quotes blocks``` ````.
      placeholder: |
        A clear and concise description of what went wrong.

        Pipeline stage:
        e.g., background correction, segmentation, feature extraction

        ```python
        # Minimal code or notebook cell that reproduces the problem
        ```

        Expected result:
        Describe the output, metadata, image, mask, or measurement you expected.

        Actual result:
        Describe what ACID produced instead.

        ```
        The error message you got, with the full traceback.
        ```
    validations:
      required: true

  #--------------   Relevant LOG Output   --------------
  - type: textarea
    id: logs
    attributes:
      label: Relevant LOG output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell

  #--------------   Code of Conduct   --------------
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/IDIP-Platform/ACID/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true

  - type: markdown
    attributes:
      value: >
        Thank you for your contribution! 🎉 The ACID Team
