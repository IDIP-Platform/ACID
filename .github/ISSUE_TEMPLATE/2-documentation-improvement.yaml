name: 📔 Documentation Improvement
description: Report wrong or missing documentation

title: "[DOC]: "
labels:
  - "docs"
  - "triage"

body:
#----------------   Location of the documentation --------------
  - type: textarea
    id: location
    attributes:
      label: Location of the documentation
      description: >
        Please provide the location of the documentation, such as a README section, notebook,
        function or module docstring, pipeline-stage description, metadata/output description,
        configuration instructions, installation instructions, or documentation URL.
      placeholder: https://github.com/IDIP-Platform/ACID
    validations:
      required: true

#----------------   Problem Description --------------
  - type: textarea
    id: problem
    attributes:
      label: Documentation problem
      description: >
        Please describe what is missing, unclear, outdated, or incorrect. If relevant, explain
        whether this affects scientists, SSC developers, maintainers, new users, or future HPC users.
    validations:
      required: true

#----------------   Suggested Fix  --------------
  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested fix for documentation
      description: >
        If you have a suggested fix, explain what should be added or changed and why it would make
        the documentation more useful.

#--------------   Code of Conduct   --------------
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/IDIP-Platform/ACID/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true

  - type: markdown
    attributes:
      value: >
        Thank you for your contribution! 🎉 The ACID Team
