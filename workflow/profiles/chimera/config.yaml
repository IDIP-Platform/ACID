# Chimera cluster (SLURM). Run the Snakemake main process on a login node
# inside tmux/screen; it submits every job with sbatch:
#
#   uv run --frozen --group pipeline snakemake -s workflow/Snakefile \
#       --profile workflow/profiles/chimera --config acid_config=configs/<id>.yaml
#
# Scientific parameters stay in the ACID config; this file only sets compute
# resources. Check accounts and partitions with `smypartition`. Runtimes and
# memory are first estimates: tune them after the first run (sacct / seff).
executor: slurm
jobs: 150
printshellcmds: true
rerun-incomplete: true
keep-going: true
# A failed job (e.g. out of memory) is submitted once more.
retries: 1
latency-wait: 60

# Per job; runtime in minutes.
default-resources:
  slurm_account: "rse"
  slurm_partition: "ffa-short"   # max 2 h
  runtime: 5
  mem_mb: 4000
  cpus_per_task: 1

set-resources:
  extract_acquisition:
    runtime: 60
    mem_mb: 16000
  background_function:
    slurm_partition: "ffa"
    runtime: 240
    mem_mb: 64000
  segment:
    slurm_partition: "gpu-ffa"
    gpu: 1
    cpus_per_task: 4
    mem_mb: 16000
  extract_features:
    runtime: 15
    mem_mb: 16000

# Every raw file and FOV is its own SLURM job, except segmentation: there
# several FOVs share one GPU job, so Cellpose is loaded once per job. Jobs
# inside a group run one after another (as many as `resources` allows side
# by side), so a group's runtime is the sum of its jobs' runtimes: 20 x 5 min.
group-components:
  object_segmentation: 20
resources:
  gpu: 1
# Count these per group job, not summed over all submitted jobs.
set-resource-scopes:
  gpu: local
  mem_mb: local
  cpus_per_task: local
