# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  test_pipeline:

   # The type of runner that the job will run on
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [3.11, 3.12] #according to pyproject.toml, we support 3.11 and 3.12
    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Getting repository
      uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
    - name: Install dependencies
      run: |
        uv pip install --system -e .
        uv pip install --system ipykernel pytest nbval
    - name: Install system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libegl1 libgles2
    - name: Install system dependencies
      if: runner.os == 'macOS'
      run: |
        brew install mesa
    - name: Install system dependencies
      if: runner.os == 'Windows'
      run: |
        choco install mesa3d -y

    - name: notebook part1
      run: |
        python -m pytest --nbval  notebooks/part1_extract_field_of_view.ipynb --sanitize-with tests/doc_sanitize.cfg
    - name: notebook part2
      run: |
        python -m pytest --nbval  notebooks/part2_split_train_test.ipynb  --sanitize-with tests/doc_sanitize.cfg
    - name: notebook part3
      run: |
        python -m pytest --nbval  notebooks/part3_control_image_quality.ipynb --sanitize-with tests/doc_sanitize.cfg
    - name: notebook part3extra
      run: |
        python -m pytest --nbval notebooks/part3extra_test_image_qc.ipynb  --sanitize-with tests/doc_sanitize.cfg

    - name: notebook part3extra check
      run: |
        python -m pytest --nbval  notebooks/part3extra_check_ch_treatment.ipynb --sanitize-with tests/doc_sanitize.cfg

    - name: notebook part4a
      run: |
        python -m pytest --nbval  notebooks/part4a_compute_background_function.ipynb --sanitize-with tests/doc_sanitize.cfg

    - name: notebook part4b
      run: |
        python -m pytest --nbval  notebooks/part4b_correct_background.ipynb --sanitize-with tests/doc_sanitize.cfg

    - name: notebook part4extra
      run: |
        python -m pytest --nbval notebooks/part4extra_test_correct_background.ipynb  --sanitize-with tests/doc_sanitize.cfg

    - name: notebook part5
      run: |
        python -m pytest --nbval  notebooks/part5_segment_object.ipynb --sanitize-with tests/doc_sanitize.cfg

    - name: notebook part6
      run: |
        python -m pytest --nbval notebooks/part6_extract_feature.ipynb --sanitize-with tests/doc_sanitize.cfg
