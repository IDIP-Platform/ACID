# Chimera cluster (SLURM). Run the Snakemake main process on a login node
# inside tmux/screen; it submits every job with sbatch:
#
#   uv run --frozen --group pipeline snakemake -s workflow/Snakefile \
#       --profile workflow/profiles/chimera --config acid_config=configs/<id>.yaml
#
# This file sets compute resources only. Scientific parameters are in the
# ACID config, and the number of FOVs per job in workflow/config.yaml
# (batch_sizes); a batch rule's runtime below must cover a whole batch.
# Check accounts and partitions with `smypartition`; tune runtimes and memory
# with `sacct`/`seff` after a run.
executor: slurm
jobs: 150
printshellcmds: true
rerun-incomplete: true
keep-going: true
# A failed job (e.g. out of memory) is submitted once more.
retries: 1
latency-wait: 60
# First check of a submitted job's state after 15 s (plugin default 40 s; the
# interval then grows by 10 s per check without a finished job). Finished
# stages are noticed sooner, so the next stage starts sooner.
slurm-init-seconds-before-status-checks: 15

# Fallback for anything not listed below; every rule is listed explicitly.
# No cpus_per_task here: it would override the rules' threads.
default-resources:
  slurm_account: "rse"
  slurm_partition: "ffa-short"   # max 2 h
  runtime: 5                     # minutes
  mem_mb: 4000

# Threads of every rule. Inside a job they set the number of threads the
# rule uses (e.g. OMP_NUM_THREADS); the SLURM CPU request is cpus_per_task
# below, kept equal to these values.
set-threads:
  # part0 / part1
  extract_acquisition: 16        # reading and decoding one ND2 file
  merge_extraction: 1            # local rule (Snakemake main process)
  split: 1                       # local rule
  # part2
  measure_quality: 1             # single-threaded per FOV
  flag_quality: 1                # local rule
  # part3 / part4
  background_function: 16        # reading + median in 16 threads; fit: one thread per channel (5)
  correct_background: 1          # single-threaded per FOV
  merge_background_correction: 1 # local rule
  # part5
  segment: 4                     # Cellpose pre/post-processing next to the GPU
  merge_segmentation: 1          # local rule
  # part6
  extract_features: 1            # single-threaded per FOV
  merge_features: 1              # local rule
  all: 1                         # local rule (target only)

# SLURM resources of every rule submitted as a job. Runtime in minutes,
# memory in MB. Local rules (merge_extraction, split, flag_quality,
# merge_background_correction, merge_segmentation, merge_features, all) run
# in the Snakemake main process and get no SLURM resources.
set-resources:
  # one job per raw .nd2 file (~1.5 min with 16 CPUs)
  extract_acquisition:
    slurm_partition: "ffa-short"
    cpus_per_task: 16
    mem_mb: 32000
    runtime: 30
  # one job per batch of batch_sizes.measure_quality FOVs (~5.6 s per FOV)
  measure_quality:
    slurm_partition: "ffa-short"
    cpus_per_task: 1
    mem_mb: 4000
    runtime: 15
  # one job; reads all unflagged training FOVs (~2 GB) and fits 5 channels.
  # The fit is the rolling ball (radius 200), single-threaded per channel; the 5
  # channels run side by side, so the job takes as long as one channel. Its
  # speed depends only on the CPU: per channel ~67 s on EPYC 7543, ~92 s on
  # EPYC 9655, ~197 s on the old Xeon E5-2650 v4 nodes; more threads do not
  # help. Hence the constraint to EPYC 7543 nodes (11 in ffa).
  background_function:
    slurm_partition: "ffa"         # max 12 h
    constraint: "epyc7543"         # sbatch --constraint (not allowed in slurm_extra)
    cpus_per_task: 16
    mem_mb: 64000
    runtime: 120
  # one job per batch of batch_sizes.correct_background FOVs (~2.2 s per FOV)
  correct_background:
    slurm_partition: "ffa-short"
    cpus_per_task: 1
    mem_mb: 4000
    runtime: 10
  # one job per batch of batch_sizes.segment FOVs (~0.3 s per FOV; first job on
  # a node ~1-2 min extra to read torch/CUDA from /home into the page cache)
  segment:
    slurm_partition: "gpu-ffa"
    # Chimera's GPU partitions take --gres only (not --gpus=N, which the
    # plugin's `gpu` resource would produce). A whole GPU per job: only two
    # gpu-ffa nodes (one L40 each) offer MPS, so "mps:N" would limit
    # segmentation to those two GPUs while other L40s stay free.
    gres: "gpu:1"
    cpus_per_task: 4
    mem_mb: 16000
    runtime: 10
  # one job per batch of batch_sizes.extract_features FOVs (~14 s, up to 24 s per FOV)
  extract_features:
    slurm_partition: "ffa-short"
    cpus_per_task: 1
    mem_mb: 16000
    runtime: 30

# Every job is submitted on its own. Snakemake group jobs (group-components)
# are not used: Snakemake 9.27 additionally created one group holding every
# segmentation job, beyond the partition time limit. FOVs are batched by the
# workflow instead (workflow/config.yaml).
