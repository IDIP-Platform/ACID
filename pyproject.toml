[project]
name = "acid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
  { name = "Alesandro Ulivi", email = "alessandro.ulivi@uni-heidelberg.de" },
]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "bioio>=3.2.0",
  "bioio-nd2>=1.6.2",
  "cellpose>=4.0.9",
  "dask>=2026.1.2",
  "jupyterlab>=4.5.6",
  "mahotas>=1.4.18",
  "matplotlib>=3.10.8",
  "napari==0.6.6",
  "numba>=0.64.0",
  "numpy>=2.4.3",
  "opencv-python>=4.13.0.92",
  "pandas>=3.0.1",
  "pycytominer>=1.4.0",
  "roifile>=2026.2.10",
  "scikit-image>=0.26.0",
  "scikit-learn>=1.8.0",
  "scipy>=1.17.1",
  "seaborn>=0.13.2",
  "statsmodels>=0.14.6",
  "tifffile>=2026.3.3",
  "torch>=2.10.0",
  "torch-vision>=0.1.6.dev0",
]

[project.scripts]
acid = "acid:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acid"]

